services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=courtbook'
      - 'MYSQL_USER=${COURTBOOK_DB_USER:-courtbook}'
      - 'MYSQL_PASSWORD=${COURTBOOK_DB_PASSWORD:-courtbook_dev}'
      - 'MYSQL_ROOT_PASSWORD=${COURTBOOK_DB_ROOT_PASSWORD:-courtbook_root_dev}'
    ports:
      - '3307:3306'
    volumes:
      - 'courtbook-mysql-data:/var/lib/mysql'

volumes:
  courtbook-mysql-data:
